name: Publish progress

# Refresh progress pages for all enabled classrooms. Sequence:
#   1. matrix job: discover classroom directories (publish.json present and
#      enabled != false) -> per-classroom publish jobs;
#   2. each publish job dispatches the classroom50 collect-scores workflow
#      (fresh scores at publish time), generates <classroom>/data/progress.json
#      and commits it ONLY if content changed (timestamps ignored when
#      comparing; failed runs commit nothing and show up red in Actions);
#   3. index job: rebuild classrooms.json from the committed data and commit
#      it if changed; the root page shows the classroom list from it.
# To add a classroom: create <slug>/publish.json ({"enabled": true}) and an
# optional <slug>/index.html redirect stub; the matrix picks it up
# automatically. To pause a classroom: set "enabled": false.

on:
  schedule:
    # 20:00 UTC = 03:00 Asia/Novosibirsk (UTC+7)
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      collect:
        description: "Dispatch classroom50 score collection first"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: publish-progress
  cancel-in-progress: false

env:
  CONFIG_REPO: classroom50

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      classrooms: ${{ steps.list.outputs.classrooms }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: |
          set -euo pipefail
          echo "classrooms=$(python3 scripts/list_classrooms.py)" >> "$GITHUB_OUTPUT"

  publish:
    needs: matrix
    strategy:
      # One broken classroom must not block the others.
      fail-fast: false
      matrix:
        classroom: ${{ fromJSON(needs.matrix.outputs.classrooms) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Collect fresh scores (classroom50 workflow)
        if: ${{ github.event_name == 'schedule' || inputs.collect }}
        env:
          GH_TOKEN: ${{ secrets.PROGRESS_PAT }}
          ORG: ${{ github.repository_owner }}
          CLASSROOM: ${{ matrix.classroom }}
        run: |
          set -euo pipefail
          gh workflow run collect-scores.yaml \
            --repo "$ORG/$CONFIG_REPO" \
            -f classroom="$CLASSROOM" -f assignment=
          sleep 5
          RUN_ID=$(gh run list --repo "$ORG/$CONFIG_REPO" \
            --workflow=collect-scores.yaml --event=workflow_dispatch \
            --json databaseId,createdAt --jq 'sort_by(.createdAt) | last | .databaseId')
          echo "waiting for collect run $RUN_ID"
          gh run watch "$RUN_ID" --repo "$ORG/$CONFIG_REPO" --exit-status

      - name: Generate progress.json
        env:
          PROGRESS_PAT: ${{ secrets.PROGRESS_PAT }}
          PROGRESS_ORG: ${{ github.repository_owner }}
          PROGRESS_CLASSROOM: ${{ matrix.classroom }}
          PROGRESS_CONFIG_REPO: ${{ env.CONFIG_REPO }}
        run: python3 scripts/generate_progress.py

      - name: Commit if content changed
        env:
          CLASSROOM: ${{ matrix.classroom }}
        run: |
          set -euo pipefail
          FILE="$CLASSROOM/data/progress.json"
          git fetch origin main -q

          if git cat-file -e "origin/main:$FILE" 2>/dev/null; then
            git show "origin/main:$FILE" > /tmp/old.json
            if python3 scripts/compare_progress.py "$FILE" /tmp/old.json; then
              echo "no content changes in $FILE, skipping commit"
              exit 0
            fi
          else
            echo "first publish of $FILE"
          fi

          git config user.name "progress-bot"
          git config user.email "bot@progress.local"
          git add "$FILE"
          git commit -m "progress($CLASSROOM): refresh content"
          git pull --rebase origin main
          git push

  index:
    # Rebuild the classroom list from committed data (after all publishes).
    needs: publish
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: python3 scripts/build_index.py

      - name: Commit if changed
        run: |
          set -euo pipefail
          git fetch origin main -q

          if git cat-file -e "origin/main:classrooms.json" 2>/dev/null; then
            git show "origin/main:classrooms.json" > /tmp/old.json
            if python3 scripts/compare_progress.py classrooms.json /tmp/old.json; then
              echo "no changes to classrooms.json, skipping commit"
              exit 0
            fi
          else
            echo "first publish of classrooms.json"
          fi

          git config user.name "progress-bot"
          git config user.email "bot@progress.local"
          git add classrooms.json
          git commit -m "index: refresh classroom list"
          git pull --rebase origin main
          git push
